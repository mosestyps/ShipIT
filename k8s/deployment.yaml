apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipit
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shipit
  template:
    metadata:
      labels:
        app: shipit
    spec:
      containers:
        - name: shipit
          image: shipit:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000